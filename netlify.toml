[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Product renders and shape photos are content-addressed by name — a changed
# image ships under a new filename, so they can be cached indefinitely.
[[headers]]
  for = "/assets/rings/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/shapes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vite emits hashed filenames for JS/CSS — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
