# Netlify по умолчанию канонизирует адреса: одну форму со слэшем отдаёт,
# вторую разворачивает редиректом 301. Каталог отдаётся через прокси с
# основного домена, и такой редирект уезжает в браузер посетителя — а
# при смене направления складывается в петлю. Обе формы адреса заданы
# явными правилами в _redirects, которые собирает scripts/prerender.mjs.
[build.processing.html]
  pretty_urls = false

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Catalog imagery only (/catalog uses these; the configurator does not).
# A changed render ships under a new filename, so these can be cached for good.
[[headers]]
  for = "/assets/rings/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/shapes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
