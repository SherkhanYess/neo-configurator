    <meta name="description" content="Помолвочные кольца с бриллиантами: цена сразу, срок изготовления 5–10 дней, сертификат IGI. Примерка в шоурумах Алматы и Астаны." />
    <link rel="icon" type="image/png" href="/assets/taena/favicon.png" />

    <!-- Что нужно первому экрану — качается сразу, вместе с кодом, а не после
         него: шрифты обложки и заголовков и данные ленты (те же адреса, что
         запрашивает код, — браузер берёт уже скачанное). -->

    <link rel="preload" href="/src/assets/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/manrope-400-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/api/get-products" as="fetch" crossorigin />
    <link rel="preload" href="/api/get-prices" as="fetch" crossorigin />
    <!-- Ленту запрашиваем прямо отсюда, а код берёт уже начатый ответ
         (src/catalog/data/content.js): так запрос гарантированно не повторится. -->
    <script>
      if (!location.pathname.startsWith('/admin')) {
        window.__ndFeed = fetch('/api/content/feed').then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); });
        window.__ndFeed.catch(function () {});
      }
    </script>
